name: Update kodik-mpv-plugin submodule

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update plugin submodule to latest main
        run: |
          git -C kodik-mpv-plugin fetch origin main
          git -C kodik-mpv-plugin checkout --detach FETCH_HEAD

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-kodik-mpv-plugin
          commit-message: "Update kodik-mpv-plugin submodule"
          title: "Update kodik-mpv-plugin submodule"
          body: "Updates the kodik-mpv-plugin submodule to the latest commit on its main branch."
